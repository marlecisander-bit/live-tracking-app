<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#ffffff">

    <title>Sightseeing Shkodra - Live Map</title>
    <link rel="icon" href="assets/brand/sightseeing-shkodra-light.svg" type="image/svg+xml">

    <link rel="stylesheet" href="css/shared.css">
    <link rel="stylesheet" href="css/live-map/page-layout.css">
    <link rel="stylesheet" href="css/live-map/map-information.css">
    <link rel="stylesheet" href="css/live-map/map-buttons.css">
    <link rel="stylesheet" href="css/live-map/stops-panel.css">
    <link rel="stylesheet" href="css/live-map/map-markers.css">
    <link rel="stylesheet" href="css/live-map/notifications.css">
    <link rel="stylesheet" href="css/live-map/leaflet-adjustments.css">
    <link rel="stylesheet" href="css/live-map/mobile-layout.css">

    <!-- LEAFLET -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>


    <!-- SUPABASE -->
    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3">
    </script>


    <!-- TURF -->
    <script
        src="https://cdn.jsdelivr.net/npm/@turf/turf@7.3.5/turf.min.js">
    </script>

    <script src="js/shared/app-config.js"></script>
    <script src="js/shared/gps-source.js"></script>

</head>


<body>

<div id="app">


    <!-- HEADER -->

    <div id="header">

        <div id="brand">

            <img class="brand-logo" src="assets/brand/sightseeing-shkodra-light.svg" alt="Sightseeing Shkodra">
            <span class="brand-title">Sightseeing Shkodra</span>

        </div>


        <div id="live-badge">

            <span class="live-dot"></span>

            <span id="live-badge-text" aria-live="polite">
                LIVE
            </span>

        </div>

    </div>



    <!-- MAP -->

    <div id="map"></div>


    <div id="map-loading" role="status" aria-live="polite">
        Locating sightseeing van...
    </div>




    <!-- NEXT STOP CARD -->

    <div id="next-card">

        <div id="next-card-top">

            <div id="next-label">
                VAN STATUS
            </div>


            <div class="next-card-actions">
                <div id="next-direction">--</div>
                <button
                    id="status-card-toggle"
                    type="button"
                    aria-label="Show more vehicle information"
                    aria-expanded="false"
                    data-action="toggleStatusCard"
                >
                    <span aria-hidden="true">&#8964;</span>
                </button>
            </div>

        </div>


        <div id="van-message-label">
            Live vehicle
        </div>


        <div id="van-movement-status" aria-live="polite" aria-atomic="true">
            Locating sightseeing van...
        </div>


        <div id="next-destination-row">
            <span id="next-destination-label">Going to</span>
            <strong id="next-stop-name">Calculating...</strong>
        </div>


        <div id="next-meta" aria-live="polite">

            <span>
                <span class="vehicle-inline-icon" data-vehicle-icon></span>
                <strong id="eta-value">--</strong>
            </span>


            <span>
                <strong id="next-stop-distance">--</strong>
            </span>

        </div>


        <div id="eta-progress-wrap" class="status-card-extra">

            <div id="eta-progress-head">

                <span>
                    Route progress
                </span>

                <span id="eta-progress-value">
                    --
                </span>

            </div>


            <div id="eta-progress-track">
                <div id="eta-progress-bar"></div>
            </div>

        </div>

        <!-- Temporary route messages stay with the next-stop information. -->
        <div id="route-status-banner" class="status-card-extra" aria-live="polite"></div>

    </div>




    <!-- NEAREST STOP CARD -->

    <div id="nearest-stop-card">

        <div class="nearest-stop-head">
            <div id="nearest-stop-label">NEAREST STOP</div>
            <div id="nearest-stop-distance">--</div>
        </div>

        <div id="nearest-stop-name">Finding nearest stop...</div>

        <div class="nearest-stop-bottom">

            <div id="nearest-stop-van-eta">
                Van <strong>--</strong>
            </div>

            <button
                id="walk-to-stop"
                type="button"
        data-action="walkToNearestStop"
            >
                Walk to Stop &rarr;
            </button>

        </div>

    </div>


    <!-- FOLLOW INDICATOR -->

    <button id="follow-indicator" type="button" data-action="handleFindVan">
        Following van <span aria-hidden="true">&bull;</span> Tap to recenter
    </button>



    <!-- MAP CONTROLS -->

    <div id="map-controls">


        <button
            class="map-control-btn"
            id="btn-find-me"
            aria-label="Find my location"
            title="Show your location"
        data-action="handleFindMe"
            type="button"
        >

            <span class="map-control-icon">

                <svg viewBox="0 0 24 24">

                    <circle
                        cx="12"
                        cy="12"
                        r="8.5"
                    ></circle>

                    <circle
                        cx="12"
                        cy="12"
                        r="2.2"
                        class="icon-fill"
                    ></circle>

                    <path d="M12 2V4"></path>
                    <path d="M12 20V22"></path>
                    <path d="M2 12H4"></path>
                    <path d="M20 12H22"></path>

                </svg>

            </span>

            <span class="map-control-label">
                Find Me
            </span>

        </button>



        <button
            class="map-control-btn active"
            id="btn-find-van"
            aria-label="Find sightseeing van"
            title="Show the sightseeing bus"
        data-action="handleFindVan"
            type="button"
        >

            <span class="map-control-icon" data-vehicle-icon></span>

            <span class="map-control-label">
                Find Van
            </span>

        </button>



        <button
            class="map-control-btn"
            id="btn-route"
            aria-label="Show full route"
            title="Display the complete route"
        data-action="handleRoute"
            type="button"
        >

            <span class="map-control-icon">

                <svg viewBox="0 0 24 24">

                    <path
                        d="M5 17
                           C7 17 7 12 10 12
                           C13 12 12 7 16 7"
                    ></path>

                    <circle
                        cx="5"
                        cy="17"
                        r="2"
                    ></circle>

                    <circle
                        cx="16"
                        cy="7"
                        r="2"
                    ></circle>

                </svg>

            </span>

            <span class="map-control-label">
                Route
            </span>

        </button>



        <button
            class="map-control-btn"
            id="btn-stops"
            aria-label="Show stops and live arrivals"
            title="View stops and arrival times"
        data-action="handleStops"
            type="button"
        >

            <span class="map-control-icon">

                <svg viewBox="0 0 24 24">

                    <path
                        d="M12 21
                           C12 21 18 15 18 9
                           C18 5.7 15.3 3 12 3
                           C8.7 3 6 5.7 6 9
                           C6 15 12 21 12 21Z"
                    ></path>

                    <circle
                        cx="12"
                        cy="9"
                        r="2.2"
                    ></circle>

                </svg>

            </span>

            <span class="map-control-label">
                Stops
            </span>

        </button>


    </div>



    <!-- BACKDROP -->

    <button
        id="panel-backdrop"
        type="button"
        aria-label="Close stops panel"
            data-action="closeStopsPanel">
    </button>



    <!-- STOPS PANEL -->

    <div
        id="stops-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="stops-panel-title"
        aria-hidden="true"
        tabindex="-1">


        <div id="stops-panel-header">

            <div id="stops-panel-handle"></div>


            <div class="stops-title-row">

                <div>

                    <div id="stops-panel-title">
                        Stops
                    </div>

                    <div id="stops-panel-subtitle">
                        Live arrivals
                    </div>

                </div>


                <button
                    id="close-stops"
                    type="button"
                    aria-label="Close stops panel"
                data-action="closeStopsPanel">

                    &times;

                </button>

            </div>

        </div>


        <div id="stop-arrivals-list" aria-live="polite">

            Waiting for route information...

        </div>


    </div>



    <div id="toast" role="status" aria-live="polite"></div>


</div>


<!-- Live Map features load in dependency order. -->
<script src="js/live-map/app-settings.js"></script>
<script src="js/shared/vehicle-icon.js"></script>
<script src="js/live-map/connect-to-database.js"></script>
<script src="js/live-map/project-context.js"></script>
<script src="js/live-map/create-map.js"></script>
<script src="js/live-map/app-state.js"></script>
<script src="js/live-map/map-buttons.js"></script>
<script src="js/live-map/map-icons.js"></script>
<script src="js/live-map/load-published-map.js"></script>
<script src="js/live-map/build-route-contexts.js"></script>
<script src="js/live-map/prepare-route-data.js"></script>
<script src="js/live-map/route-movement-calculations.js"></script>
<script src="js/live-map/calculate-arrivals.js"></script>
<script src="js/live-map/load-vehicle-progress.js"></script>
<script src="js/live-map/update-route-progress.js"></script>
<script src="js/live-map/stops-panel.js"></script>
<script src="js/live-map/map-popups.js"></script>
<script src="js/live-map/track-bus.js"></script>
<script src="js/live-map/track-user.js"></script>
<script src="js/live-map/display-full-route.js"></script>
<script src="js/live-map/format-display-values.js"></script>
<script src="js/live-map/automatic-refresh.js"></script>
<script src="js/live-map/notifications.js"></script>
<script src="js/live-map/connect-page-actions.js"></script>
<script src="js/live-map/start-live-map.js"></script>

</body>
</html>
