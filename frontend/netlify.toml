headersOrigin = "config"
plugins = []
redirects = []

[functions]

  [functions."*"]

[build]
publish = "C:\\Users\\a.marleci\\OneDrive - Dilaxia SpA\\Desktop\\Sightseeing Shkodra Map App\\dist"
publishOrigin = "config"
command = "node tools/check-live-release-compatibility.cjs production && node tools/build-site.cjs --environment=production"
commandOrigin = "config"

  [build.environment]

  [build.processing]

    [build.processing.css]

    [build.processing.html]

    [build.processing.images]

    [build.processing.js]

  [build.services]

[[headers]]
for = "/"

  [headers.values]
  Cache-Control = "no-cache, must-revalidate"

[[headers]]
for = "/manifest.webmanifest"

  [headers.values]
  Cache-Control = "no-cache, must-revalidate"

[[headers]]
for = "/*.html"

  [headers.values]
  Cache-Control = "no-cache, must-revalidate"

[[headers]]
for = "/js/*"

  [headers.values]
  Cache-Control = "no-cache, must-revalidate"

[[headers]]
for = "/css/*"

  [headers.values]
  Cache-Control = "no-cache, must-revalidate"

[[headers]]
for = "/manifest.webmanifest"

  [headers.values]
  Content-Type = "application/manifest+json"
  Cache-Control = "no-cache, must-revalidate"

[[headers]]
for = "/icons/*"

  [headers.values]
  Cache-Control = "no-cache, must-revalidate"