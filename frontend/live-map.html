<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#ffffff">

    <title>Sightseeing Shkodra - Live Map</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icons/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">

    <link rel="stylesheet" href="css/shared.css">
    <link rel="stylesheet" href="css/live-map/page-layout.css">
    <link rel="stylesheet" href="css/live-map/map-information.css">
    <link rel="stylesheet" href="css/live-map/map-buttons.css">
    <link rel="stylesheet" href="css/live-map/stops-panel.css">
    <link rel="stylesheet" href="css/live-map/map-markers.css">
    <link rel="stylesheet" href="css/live-map/notifications.css">
    <link rel="stylesheet" href="css/live-map/leaflet-adjustments.css">
    <link rel="stylesheet" href="css/live-map/mobile-layout.css">
    <link rel="stylesheet" href="css/live-map/tourist-layout.css">
    <link rel="stylesheet" href="css/widget-controls.css">
    <link rel="stylesheet" href="css/live-map/responsive-presentation.css">
    <link rel="stylesheet" href="css/live-map/tourist-card.css">
<link rel="stylesheet" href="css/live-map/final-tourist.css">

    <!-- LEAFLET -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>


    <!-- SUPABASE -->
    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3">
    </script>


    <!-- TURF -->
    <script
        src="https://cdn.jsdelivr.net/npm/@turf/turf@7.3.5/turf.min.js">
    </script>

    <script src="js/shared/app-config.js"></script>
<script src="js/shared/map-content-safety.js"></script>
<script src="js/shared/stop-design-defaults.js"></script>
<script src="js/shared/stop-design.js"></script>
    <script src="js/shared/tracking-realtime.js"></script>
    <script src="js/shared/tracking-state.js"></script>
    <script src="js/shared/gps-source.js"></script>


    <link rel="stylesheet" href="css/stop-design.css">
</head>


<body>

<div id="app">


    <!-- HEADER -->

    <div id="header">

        <div id="brand">

            <img class="brand-logo" src="assets/brand/sightseeing-shkodra-red.svg" alt="Sightseeing Shkodra">
            <span class="brand-title">Sightseeing Shkodra</span>
            <span class="brand-tagline">LIVE TRACKING &amp; MORE</span>
            <span class="brand-subtitle">Track your ride. Explore Shkodra.</span>

        </div>


        <div id="live-badge" hidden aria-hidden="true" style="display:none">

            <span class="live-dot"></span>

            <span id="live-badge-text" aria-live="polite">
                WAITING FOR GPS
            </span>

        </div>

    </div>



    <!-- MAP -->

    <div id="map"></div>


    <div id="map-loading" role="status" aria-live="polite">
        Loading the sightseeing map…
    </div>




    <!-- One tourist information card; technical diagnostics stay in admin. -->
    <section id="next-card" aria-label="Live sightseeing journey">
      <header id="next-card-top"><span id="operational-live" hidden>LIVE</span></header>
      <div id="journey-main" aria-live="polite" aria-atomic="true">
        <p id="journey-context"></p><h1 id="journey-destination">Live location temporarily unavailable</h1>
        <div id="journey-facts">
          <span id="journey-activity-row"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 3-7 18-3-8-8-3Z"/></svg><span id="journey-activity"></span></span>
          <span id="journey-eta-row" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span id="journey-eta"></span></span>
        </div>
      </div>
      <ol id="tourist-timeline" aria-label="Five-stop journey"></ol>
      <!-- Retained hidden adapter anchors for existing refresh/control contracts. -->
      <div hidden aria-hidden="true" id="legacy-status-anchors"><span id="van-movement-status"></span><span id="van-message-label"></span><span id="operational-stop-badge"></span><span id="next-destination-label"></span><span id="next-stop-name"></span><span id="next-destination-row"></span><span id="eta-value"></span><span id="eta-unavailable"></span><span id="next-stop-distance"></span><span id="next-meta"></span><span id="tourist-service-note"></span><span id="tourist-observation"></span><span id="tourist-progress"></span><span id="tourist-activity-confidence"></span><span id="tourist-position-confidence"></span><span id="tourist-eta-confidence"></span><span id="tourist-next-destination"></span><span id="tourist-schedule-details"></span><span id="tourist-location-warning"></span><span id="route-status-banner"></span></div>
    </section>

    <!-- FOLLOW INDICATOR -->

    <button id="follow-indicator" type="button" data-action="handleFindVan">
        Following van <span aria-hidden="true">&bull;</span> Tap to recenter
    </button>



    <!-- MAP CONTROLS -->

    <div id="map-controls" class="widget-action-bar widget-action-bar--overlay">


        <button
            class="map-control-btn"
            id="btn-find-me"
            aria-label="Find my location"
            title="Show your location"
        data-action="handleFindMe"
            type="button"
        >

            <span class="map-control-icon">

                <svg viewBox="0 0 24 24">

                    <circle
                        cx="12"
                        cy="12"
                        r="8.5"
                    ></circle>

                    <circle
                        cx="12"
                        cy="12"
                        r="2.2"
                        class="icon-fill"
                    ></circle>

                    <path d="M12 2V4"></path>
                    <path d="M12 20V22"></path>
                    <path d="M2 12H4"></path>
                    <path d="M20 12H22"></path>

                </svg>

            </span>

            <span class="map-control-label">
                Find Me
            </span>

        </button>



        <button
            class="map-control-btn active"
            id="btn-find-van"
            aria-label="Find sightseeing van"
            title="Show the sightseeing bus"
        data-action="handleFindVan"
            type="button"
        >

            <span class="map-control-icon" data-vehicle-icon></span>

            <span class="map-control-label">
                Find Van
            </span>

        </button>



        <button
            class="map-control-btn"
            id="btn-route"
            aria-label="Show full route"
            title="Display the complete route"
        data-action="handleRoute"
            type="button"
        >

            <span class="map-control-icon">

                <svg viewBox="0 0 24 24">

                    <path
                        d="M5 17
                           C7 17 7 12 10 12
                           C13 12 12 7 16 7"
                    ></path>

                    <circle
                        cx="5"
                        cy="17"
                        r="2"
                    ></circle>

                    <circle
                        cx="16"
                        cy="7"
                        r="2"
                    ></circle>

                </svg>

            </span>

            <span class="map-control-label">
                Route
            </span>

        </button>



        <button
            class="map-control-btn"
            id="btn-stops"
            aria-label="Show stops and live arrivals"
            title="View stops and arrival times"
        data-action="handleStops"
            type="button"
        >

            <span class="map-control-icon">

                <svg viewBox="0 0 24 24">

                    <path
                        d="M12 21
                           C12 21 18 15 18 9
                           C18 5.7 15.3 3 12 3
                           C8.7 3 6 5.7 6 9
                           C6 15 12 21 12 21Z"
                    ></path>

                    <circle
                        cx="12"
                        cy="9"
                        r="2.2"
                    ></circle>

                </svg>

            </span>

            <span class="map-control-label">
                Stops
            </span>

        </button>


    </div>



    <!-- BACKDROP -->

    <button
        id="panel-backdrop"
        type="button"
        aria-label="Close stops panel"
            data-action="closeStopsPanel">
    </button>



    <!-- STOPS PANEL -->

    <div
        id="stops-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="stops-panel-title"
        aria-hidden="true"
        tabindex="-1">


        <div id="stops-panel-header">

            <div id="stops-panel-handle"></div>


            <div class="stops-title-row">

                <div>

                    <div id="stops-panel-title">
                        Stops
                    </div>

                    <div id="stops-panel-subtitle">
                        Live arrivals
                    </div>

                </div>


                <button
                    id="close-stops"
                    type="button"
                    aria-label="Close stops panel"
                data-action="closeStopsPanel">

                    &times;

                </button>

            </div>

        </div>


        <div id="nearest-stop-card" aria-label="Walking directions to your nearest stop">
          <span id="nearest-stop-name"></span><button id="walk-to-stop" type="button" data-action="walkToNearestStop">Walking directions</button>
          <span id="nearest-stop-label" hidden>Nearest stop</span><span id="nearest-stop-distance" hidden></span><span id="nearest-stop-van-eta" hidden></span>
        </div>

        <div id="stop-arrivals-list">

            Waiting for route information...

        </div>


    </div>



    <div id="toast" role="status" aria-live="polite"></div>


</div>


<!-- Live Map features load in dependency order. -->
<script src="js/live-map/app-settings.js"></script>
<script src="js/shared/vehicle-icon.js"></script>
<script src="js/live-map/connect-to-database.js"></script>
<script src="js/live-map/project-context.js"></script>
<script src="js/live-map/create-map.js"></script>
<script src="js/live-map/app-state.js"></script>
<script src="js/live-map/map-buttons.js"></script>
<script src="js/live-map/map-icons.js"></script>
<script src="js/live-map/load-published-map.js"></script>
<script src="js/live-map/build-route-contexts.js"></script>
<script src="js/live-map/prepare-route-data.js"></script>
<script src="js/live-map/route-movement-calculations.js"></script>
<script src="js/live-map/marker-motion.js"></script>
<script src="js/live-map/calculate-arrivals.js"></script>
<script src="js/live-map/load-vehicle-progress.js"></script>
<script src="js/live-map/tourist-state.js"></script>
<script src="js/live-map/tourist-schedule.js"></script>
<script src="js/live-map/tourist-view.js"></script>
<script src="js/live-map/public-presentation.js"></script>
<script src="js/live-map/journey-route.js"></script>
<script src="js/live-map/journey-framing.js"></script>
<script src="js/live-map/update-route-progress.js"></script>
<script src="js/live-map/stops-panel.js"></script>
<script src="js/live-map/map-popups.js"></script>
<script src="js/live-map/track-bus.js"></script>
<script src="js/live-map/track-user.js"></script>
<script src="js/live-map/display-full-route.js"></script>
<script src="js/live-map/format-display-values.js"></script>
<script src="js/live-map/automatic-refresh.js"></script>
<script src="js/live-map/notifications.js"></script>
<script src="js/live-map/connect-page-actions.js"></script>
<script src="js/live-map/responsive-presentation.js"></script>
<script src="js/live-map/stop-marker-layout.js"></script>
<script src="js/live-map/start-live-map.js"></script>

<script src="js/live-map/tracking-diagnostics.js"></script>
</body>
</html>
