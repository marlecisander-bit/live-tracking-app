# Reconstructed portable build proposal. This file has NOT been applied to Netlify.
# Backend functions remain an independent Supabase boundary and are never bundled here.
[build]
  command = "npm ci --ignore-scripts && npm run check:platform && npm run lint && npm test && npm run typecheck && npm run build"
  publish = "dist"

# Cache/MIME header declarations copied from the verified deployed configuration.
[[headers]]
for = "/"

  [headers.values]
  Cache-Control = "no-cache, must-revalidate"

[[headers]]
for = "/manifest.webmanifest"

  [headers.values]
  Cache-Control = "no-cache, must-revalidate"

[[headers]]
for = "/*.html"

  [headers.values]
  Cache-Control = "no-cache, must-revalidate"

[[headers]]
for = "/js/*"

  [headers.values]
  Cache-Control = "no-cache, must-revalidate"

[[headers]]
for = "/css/*"

  [headers.values]
  Cache-Control = "no-cache, must-revalidate"

[[headers]]
for = "/manifest.webmanifest"

  [headers.values]
  Content-Type = "application/manifest+json"
  Cache-Control = "no-cache, must-revalidate"

[[headers]]
for = "/icons/*"

  [headers.values]
  Cache-Control = "no-cache, must-revalidate"
